{% extends "base.html" %}

{% block title %}{{ page.title }} &middot; {{ site.title }}{% endblock %}

{% block content %}
<article class="h-entry page" lang="{{ page.lang | default(value=lang) }}">
  {% if not page.extra.hero %}
  <header class="entry-header">
    <h1 class="entry-title p-name">{{ page.title }}</h1>
  </header>
  {% endif %}

  <div class="entry-content e-content">
    {{ page.content | safe }}
  </div>

  {% if page.url %}
  <a href="{{ page.url }}" class="u-url u-uid" aria-hidden="true" tabindex="-1" hidden></a>
  {% endif %}
</article>
{% endblock %}
